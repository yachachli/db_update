name: Daily NBA DB Update

on:
  schedule:
    # Run after late games; the box-score workflow also catches delayed results.
    - cron: "17 1 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

concurrency:
  group: nba-player-team-summary-refresh
  cancel-in-progress: false

jobs:
  run-daily-task:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx asyncpg msgspec

      - name: Run Daily Task
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python -m unittest discover -s tests -p "test_nba_transport.py" -q
          python -m db_update nba
