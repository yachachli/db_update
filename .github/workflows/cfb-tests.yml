name: CFB runtime tests
on:
  pull_request:
    paths: ['cfb_runtime/**', '.github/workflows/cfb-*.yml']
  push:
    paths: ['cfb_runtime/**', '.github/workflows/cfb-*.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cfb_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -c constraints-runtime.txt
      - run: python -m unittest discover -s tests
      - run: python -m cfb.cli pipeline --dry-run
