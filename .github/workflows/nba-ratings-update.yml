name: NBA Team Ratings Update

on:
  # Scheduled ratings now run after verified results and box scores.
  workflow_dispatch:

jobs:
  update-ratings:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-nba-crons.txt
          python -c "from sqlalchemy import create_engine; assert create_engine('postgresql://u:p@localhost/d').dialect.driver == 'psycopg2'"

      - name: Run ratings update pipeline
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python -m nba_ratings_update

