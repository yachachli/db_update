name: Daily VORP Refresh

on:
  schedule:
    # Runs after results and ratings, in Pacific time year-round.
    - cron: "7 1 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:       # Manual trigger from Actions tab

jobs:
  refresh-vorp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-nba-crons.txt
          python -c "from sqlalchemy import create_engine; assert create_engine('postgresql://u:p@localhost/d').dialect.driver == 'psycopg2'"

      - name: Run VORP refresh
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
        run: |
          python -m vorp_update
