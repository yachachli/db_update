name: CFB research data refresh
on:
  schedule:
    # All times UTC; weekly includes midweek/postseason correction catch-up.
    - cron: '17 10 * * 0,1,3,5'
    # Daily: college books post player props across midweek rather than in
    # one drop, so the board is topped up as lines appear.
    - cron: '37 16 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [weekly, markets]
        default: weekly
permissions:
  contents: read
  # The failure notice below opens an issue; nothing silently reported a
  # failure before, and two October runs collected no lines without a word.
  issues: write
concurrency:
  group: cfb-research-data
  cancel-in-progress: false
jobs:
  refresh:
    # Owner enables after configuring secrets and a successful manual smoke test.
    if: github.event_name == 'workflow_dispatch' || vars.CFB_CRON_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cfb_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -c constraints-runtime.txt
      - name: Apply isolated CFB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m cfb.cli migrate
      - name: Refresh data or capture markets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Fail safe: only the markets cron selects markets. Any edited or unknown
          # schedule falls back to weekly so ingestion can never silently stop.
          CFB_JOB_MODE: ${{ inputs.mode || (github.event.schedule == '37 16 * * *' && 'markets' || 'weekly') }}
        # Data/quotes only. Frozen artifacts must be deployed before enabling inference.
        run: python -m cfb.cli pipeline --mode "$CFB_JOB_MODE" --lookback 3 --analyses 0
      - name: Report a failed refresh
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const mode = process.env.CFB_JOB_MODE || 'unknown';
            const title = `CFB ${mode} refresh failed`;
            const body = [
              `The **${mode}** CFB refresh failed.`,
              '',
              `- run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- started: ${new Date().toISOString()}`,
              '',
              'The pipeline records where it stopped in `cfb_model_v1.pipeline_runs`',
              '(`current_stage`, `error_type`). Credentials are withheld from the',
              'logs by design, so that table is the place to look.',
              '',
              'If this is the markets mode, no new prop lines were collected, and the',
              'board will go stale until a later run succeeds.',
            ].join('\n');
            // Reuse one open issue per mode rather than filing a new one each
            // day: a cron that fails repeatedly should be one thread, not forty.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'cfb-cron',
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['cfb-cron'],
              });
            }
        env:
          CFB_JOB_MODE: ${{ inputs.mode || (github.event.schedule == '37 16 * * *' && 'markets' || 'weekly') }}
